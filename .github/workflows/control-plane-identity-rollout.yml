name: One-time runtime access diagnostic

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type diagnose-once to check East runtime access without deployment'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    if: github.ref == 'refs/heads/codex/runtime-access-diagnostic' && inputs.confirm == 'diagnose-once'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check runtime access once
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOYMENT_IDENTITY: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          PROJECT: ${{ vars.GCP_PROJECT }}
          COMPUTE_RESTRICTIONS_SECRET_NAME: ${{ secrets.COMPUTE_RESTRICTIONS_SECRET_NAME }}
        run: python3 scripts/diagnose-runtime-access-once.py
