# The image trusts every loopback TCP connection. With host networking that
# would let any process on the box log in as any role, so TCP clients must
# authenticate. The Unix socket stays open to the image's own initialization
# and to administration through `docker compose exec`.
local all  supabase_admin  trust
local all  all             peer map=supabase_map
host  all  all  127.0.0.1/32  scram-sha-256
host  all  all  ::1/128       scram-sha-256
