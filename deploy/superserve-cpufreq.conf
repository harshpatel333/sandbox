# Installed to /etc/tmpfiles.d/superserve-cpufreq.conf by deploy-vmd.
#
# vCPU threads move between cores, and under powersave the core they land on
# may still be clocked down, stalling the guest until it ramps. Idle cores keep
# their idle states. Matches nothing on hosts without cpufreq, such as VMs.
w /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor - - - - performance
